    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title></title>
  </head>

  <body>
    <iframe src="javascript:''" id="__gwt_historyFrame" tabIndex='-1' style="position:absolute;width:0;height:0;border:1"></iframe>
	<h1 id="titleString"></h1>
	<ul class="ui-listview ui-listview-inset ui-corner-all ui-shadow" id="deviceList" data-role="listview" data-inset="true" data-divider-theme="d">
	    <li data-role="list-divider">HISTOGRAM SNAPSHOT</li>
	    <li><div data-role="fieldcontain" id="histmemDiv"></div></li>
	</ul>
	<!-- Live histogram from the Kafka collection histogram service (js/kafkahistogram.js);
	     hidden unless histogram/rest answers. Same section as in mobile.html. -->
	<ul class="ui-listview ui-listview-inset ui-corner-all ui-shadow" id="kafkaHistogramList" data-role="listview" data-inset="true" data-divider-theme="d" style="display: none">
		<li data-role="list-divider">LIVE HISTOGRAM (KAFKA)</li>
		<li><div class="div-inlist-left">Stream:</div> <div class="div-inlist" id="kafkaHistogramConnection">--</div></li>
		<li><div class="div-inlist-left">Collection:</div> <div class="div-inlist" id="kafkaHistogramCollection">--</div></li>
		<li>
			<div id="kafkaHistogramImage">
				<label for="kafkaHistogramView" class="select">Plot:</label>
				<select id="kafkaHistogramView" name="kafkaHistogramView" data-mini="true">
					<option value="xy" selected="selected">Total X-Y</option>
					<option value="x">Total X</option>
					<option value="y">Total Y</option>
				</select>
				<div id="kafkaHistogramTitle"></div>
				<canvas id="kafkaHistogramCanvas" width="1" height="1"></canvas>
				<div id="kafkaHistogramScale">
					<span id="kafkaHistogramMin"></span>
					<canvas id="kafkaHistogramBar" width="256" height="1"></canvas>
					<span id="kafkaHistogramMax"></span>
				</div>
				<div id="kafkaHistogramInfo"></div>
				<div id="kafkaHistogramReadout"></div>
				<label for="kafkaHistogramLog" class="select">Intensity scale:</label>
				<select id="kafkaHistogramLog" name="kafkaHistogramLog" data-mini="true">
					<option value="linear" selected="selected">Linear</option>
					<option value="log">Logarithmic</option>
				</select>
			</div>
		</li>
	</ul>
	<hr>
	<button id="getDom">Refresh Now</button>
	<a id="statusMainButton" data-role="button" data-icon="arrow-l" data-iconpos="left" data-inline="true">Back</a>
  </body>
</html>
